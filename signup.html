<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สมัครสมาชิก · LeaveEasy</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/util.js" defer></script>
  <script src="js/nav.js" defer></script>
  <script type="module" src="js/signup.js"></script>
</head>
<body>
  <div id="nav"></div>

  <div class="container">
    <h1>สมัครสมาชิก</h1>
    <p class="subtitle">สมัครแล้วเข้าสู่ระบบให้อัตโนมัติ · บัญชีใหม่ทุกบัญชีเริ่มที่บทบาทผู้ขอลา</p>

    <div class="card">
      <div id="ข้อความเตือน" class="alert alert-error hidden"></div>

      <form id="ฟอร์มสมัคร">
        <label for="name">ชื่อ-นามสกุล</label>
        <input type="text" id="name" placeholder="เช่น สมชาย ใจดี">

        <label for="email">อีเมล</label>
        <input type="email" id="email" placeholder="เช่น somchai@example.com">

        <label for="password">รหัสผ่าน</label>
        <input type="password" id="password" placeholder="อย่างน้อย 6 ตัวอักษร">

        <div class="btn-row">
          <button type="submit" id="ปุ่มสมัคร">สมัครสมาชิก</button>
          <a class="btn btn-ghost" href="login.html">มีบัญชีอยู่แล้ว? เข้าสู่ระบบ</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
